<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f2e9" />
    <meta name="author" content="Christoph Pader" />
    <meta name="description" content="A small interactive collection by Christoph Pader." />
    <title>A work in play · Christoph Pader</title>
    <style>
      @font-face { font-family: Inter; src: url('./fonts/inter-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
      @font-face { font-family: Inter; src: url('./fonts/inter-latin-800-normal.woff2') format('woff2'); font-weight: 800; font-display: swap; }
      @font-face { font-family: 'Instrument Serif'; src: url('./fonts/instrument-serif-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
      @font-face { font-family: 'Space Mono'; src: url('./fonts/space-mono-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }

      :root { color: #22241f; background: #f5f2e9; font-family: Inter, Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      a { color: inherit; text-decoration: none; }
      button { font: inherit; cursor: pointer; }
      a:focus-visible, button:focus-visible { outline: 2px solid #3b56ef; outline-offset: 5px; }
      .banner { position: relative; width: 100%; min-height: 360px; overflow: hidden; isolation: isolate; background: #f5f2e9; }
      .banner::before { position: absolute; inset: 11px; border: 1px solid #d8d6ca; content: ''; pointer-events: none; }
      .head { position: absolute; top: 28px; left: 42px; right: 42px; display: flex; align-items: center; justify-content: space-between; z-index: 3; }
      .brand { display: flex; align-items: center; gap: 18px; }
      .mark { font-size: 43px; font-weight: 800; line-height: .8; letter-spacing: -.105em; }
      .mark span { color: #b9e84f; }
      .brand-copy { display: grid; gap: 3px; }
      .brand-copy strong { font-size: 12px; font-weight: 400; }
      .brand-copy small, .head-link, .eyebrow, .object-label, .footer-link, .shuffle small { font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 400; letter-spacing: .06em; }
      .brand-copy small { color: #6a6c62; }
      .head-link { border-bottom: 1px solid currentColor; padding-bottom: 4px; }
      .head-link:hover, .footer-link:hover { color: #3b56ef; }
      .copy { position: absolute; top: 109px; left: 78px; z-index: 2; }
      .eyebrow { display: block; margin-bottom: 14px; }
      h1 { margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 76px; font-weight: 400; line-height: .82; letter-spacing: -.028em; }
      .tagline { margin: 19px 0 0; font-size: 13px; line-height: 1.4; }
      .footer-link { position: absolute; left: 78px; bottom: 27px; z-index: 3; border-bottom: 1px solid #22241f; padding-bottom: 4px; }
      .thread { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
      .thread path { fill: none; stroke: #d8d6ca; stroke-width: 1.2; stroke-dasharray: 2 6; }
      .object { position: absolute; display: block; transition: transform .7s cubic-bezier(.22,1,.36,1), box-shadow .3s ease; }
      .object:hover { filter: drop-shadow(0 8px 9px #22241f22); }
      .object:focus-visible { outline-offset: 7px; }
      .object-label { position: absolute; white-space: nowrap; color: #55594d; }
      .postcard { top: 78px; left: 55%; width: 137px; height: 176px; padding: 8px 8px 23px; background: #fffefa; box-shadow: 0 10px 20px #22241f25; transform: rotate(-9deg); }
      .postcard::before { position: absolute; left: 46px; top: -9px; width: 53px; height: 18px; content: ''; background: #d7fd6aca; transform: rotate(-3deg); clip-path: polygon(0 11%, 100% 0, 95% 100%, 4% 89%); }
      .postcard img { width: 100%; height: 100%; object-fit: cover; object-position: center 24%; filter: saturate(.78); }
      .postcard .object-label { left: 4px; bottom: -22px; transform: rotate(9deg); }
      .graph { top: 78px; left: 70%; width: 169px; height: 133px; transform: rotate(8deg); }
      .graph svg { overflow: visible; width: 100%; height: 100%; }
      .graph-grid { stroke: #22241f; stroke-width: .6; stroke-dasharray: 1.5 4; opacity: .16; }
      .graph-line { fill: none; stroke: #3b56ef; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
      .graph .object-label { top: -22px; right: -9px; transform: rotate(-8deg); }
      .stack { left: 76%; top: 204px; width: 130px; height: 82px; transform: rotate(-9deg); }
      .stack svg { width: 100%; height: 100%; filter: drop-shadow(0 8px 6px #572c222b); }
      .stack .object-label { left: 8px; bottom: -17px; transform: rotate(9deg); }
      .record { left: 85%; top: 92px; width: 142px; height: 142px; border-radius: 50%; background: repeating-radial-gradient(circle, #151518 0 3px, #2b2a2c 3.6px 4.1px, #151518 4.5px 8px); box-shadow: 0 9px 16px #22241f32; transform: rotate(12deg); }
      .record::before { position: absolute; inset: 35%; border: 1px solid #22241f; border-radius: 50%; background: #b5a3e8; content: ''; }
      .record::after { position: absolute; left: calc(50% - 2px); top: calc(50% - 2px); width: 4px; height: 4px; border-radius: 50%; background: #22241f; content: ''; }
      .record-center { position: absolute; inset: 39%; display: grid; place-items: center; color: #22241f; font-size: 17px; font-weight: 800; letter-spacing: -.1em; }
      .record .object-label { top: -22px; left: 5px; transform: rotate(-12deg); }
      .note { left: 42%; top: 230px; width: 136px; height: 116px; padding: 14px; background: #d7fd6a; box-shadow: 0 9px 16px #22241f25; transform: rotate(8deg); }
      .note span { font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; line-height: .82; }
      .note b { position: absolute; right: 14px; bottom: 12px; font-size: 20px; font-weight: 400; }
      .shuffle { position: absolute; right: 38px; bottom: 26px; z-index: 4; display: flex; align-items: center; gap: 11px; border: 1px solid #22241f; border-radius: 30px; padding: 5px 14px 5px 5px; background: #d7fd6a; box-shadow: 3px 4px 0 #22241f; }
      .shuffle:hover { transform: translate(-2px,-2px); box-shadow: 5px 6px 0 #22241f; }
      .shuffle .plus { display: grid; place-items: center; width: 31px; height: 31px; border: 1px solid #22241f; border-radius: 50%; font-size: 24px; line-height: 1; }
      .shuffle small { font-size: 9px; }
      .banner[data-shuffled='true'] .postcard { transform: translate(124px, 47px) rotate(6deg); }
      .banner[data-shuffled='true'] .graph { transform: translate(-184px, 39px) rotate(-9deg); }
      .banner[data-shuffled='true'] .stack { transform: translate(73px, -144px) rotate(14deg); }
      .banner[data-shuffled='true'] .record { transform: translate(-95px, 28px) rotate(84deg); }
      .banner[data-shuffled='true'] .note { transform: translate(28px, -91px) rotate(-11deg); }
      @media (prefers-reduced-motion: no-preference) {
        .postcard { animation: float-a 4s ease-in-out infinite; }
        .graph { animation: float-b 5s ease-in-out infinite; }
        .graph-line { stroke-dasharray: 305; stroke-dashoffset: 305; animation: draw 3.5s ease-in-out infinite alternate; }
        .record { animation: float-b 6s ease-in-out infinite; }
        .note { animation: float-b 4.5s ease-in-out infinite; }
        .banner[data-shuffled='true'] .object { animation: none; }
      }
      @keyframes float-a { 50% { translate: 0 -6px; } }
      @keyframes float-b { 50% { translate: 0 5px; } }
      @keyframes draw { 0%, 15% { stroke-dashoffset: 305; } 85%, 100% { stroke-dashoffset: 0; } }
      @media (max-width: 800px) {
        .banner { min-height: 440px; }
        .head { left: 26px; right: 26px; }
        .copy { left: 38px; top: 112px; }
        h1 { font-size: clamp(57px, 10vw, 76px); }
        .postcard { left: 63%; top: 125px; }
        .graph { left: 62%; top: 265px; transform: scale(.8) rotate(8deg); }
        .stack { left: 40%; top: 331px; transform: scale(.8) rotate(-9deg); }
        .record { left: 84%; top: 275px; transform: scale(.75) rotate(12deg); }
        .note { display: none; }
        .footer-link { left: 38px; bottom: 35px; }
        .shuffle { right: 30px; bottom: 27px; }
      }
      @media (max-width: 540px) {
        .banner { min-height: 570px; }
        .head { top: 27px; }
        .head-link { font-size: 8px; }
        .brand-copy { display: none; }
        .copy { top: 115px; left: 30px; }
        h1 { font-size: 70px; }
        .tagline { font-size: 12px; }
        .postcard { left: 13%; top: 320px; width: 112px; height: 140px; }
        .graph { left: 49%; top: 318px; width: 132px; }
        .stack { left: 61%; top: 440px; }
        .record { display: none; }
        .footer-link { left: 30px; bottom: 31px; }
        .shuffle { right: 22px; bottom: 23px; }
        .shuffle small { display: none; }
        .banner[data-shuffled='true'] .postcard { transform: translate(15px, 27px) rotate(7deg); }
        .banner[data-shuffled='true'] .graph { transform: translate(-20px, 20px) rotate(-8deg); }
        .banner[data-shuffled='true'] .stack { transform: translate(-15px, -28px) rotate(13deg); }
      }
      @media (prefers-reduced-motion: reduce) { .object { transition: none; } }
    </style>
  </head>
  <body>
    <main class="banner" id="banner">
      <svg class="thread" viewBox="0 0 1200 360" preserveAspectRatio="none" aria-hidden="true"><path d="M558 102 C635 25 780 31 761 151 S930 344 1143 265" /></svg>
      <header class="head">
        <a class="brand" href="./" aria-label="Christoph Pader, open the collection"><span class="mark">cp<span>.</span></span><span class="brand-copy"><strong>Christoph Pader</strong><small>ENGINEER / VIENNA</small></span></a>
        <a class="head-link" href="https://github.com/chrispader/chrispader.github.io">THE SOURCE ↗</a>
      </header>
      <div class="copy"><span class="eyebrow">A SMALL COLLECTION BY CHRIS</span><h1>A work<br />in play.</h1><p class="tagline">Pick something up. See where it goes.</p></div>
      <a class="object postcard" href="./#/item/about" aria-label="Meet Chris"><img src="./images/profilePicture.png" alt="" /><span class="object-label">01 / A FACE TO THE CODE</span></a>
      <a class="object graph" href="./#/item/graph" aria-label="Explore interaction and open source"><svg viewBox="0 0 169 133" aria-hidden="true"><path class="graph-grid" d="M0 26H169M0 65H169M0 104H169M35 0V133M84 0V133M133 0V133"/><path class="graph-line" d="M4 102 C24 107 33 88 46 82 S66 87 76 55 S100 24 114 43 S139 78 164 18"/></svg><span class="object-label">04 / MAKE IT MOVE</span></a>
      <a class="object stack" href="./#/item/native" aria-label="Explore native work"><svg viewBox="0 0 130 82" aria-hidden="true"><path d="M5 48 70 31 125 47 59 67Z" fill="#d85b40" stroke="#fffaf0"/><path d="M5 48v10l54 20V67Z" fill="#dc5b3e" stroke="#fffaf0"/><path d="M59 67v11l66-20V47Z" fill="#e86a48" stroke="#fffaf0"/><path d="M5 27 70 9 125 26 59 48Z" fill="#fa734b" stroke="#fffaf0"/><path d="M5 27v10l54 20V48Z" fill="#d85b40" stroke="#fffaf0"/><path d="M59 48v9l66-20V26Z" fill="#e86a48" stroke="#fffaf0"/><path d="m44 29 28-8 22 7-28 8Z" fill="none" stroke="#fffaf0" stroke-width="1.4"/></svg><span class="object-label">05 / NATIVE THINGS</span></a>
      <a class="object record" href="./#/item/record" aria-label="Explore off the clock"><span class="record-center">cp.</span><span class="object-label">06 / OFF THE CLOCK</span></a>
      <a class="object note" href="./#/item/margelo" aria-label="Explore work at Margelo"><span>made at<br />Margelo.</span><b>✳</b></a>
      <a class="footer-link" href="./">EXPLORE THE COLLECTION ↗</a>
      <button class="shuffle" type="button" aria-label="Rearrange the collection" aria-pressed="false"><span class="plus" aria-hidden="true">+</span><small>GIVE IT A SHAKE</small></button>
    </main>
    <script>
      const banner = document.querySelector('#banner')
      const shuffle = document.querySelector('.shuffle')
      shuffle.addEventListener('click', () => {
        const shuffled = banner.dataset.shuffled !== 'true'
        banner.dataset.shuffled = String(shuffled)
        shuffle.setAttribute('aria-pressed', String(shuffled))
      })
    </script>
  </body>
</html>
